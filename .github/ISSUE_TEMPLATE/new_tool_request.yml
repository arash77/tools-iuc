name: "New tool request"
description: "Propose a new tool to be added to the Tools IUC collection"
title: "[Tool] <tool name>"
labels:
  - "new tool request"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new tool. Please provide as much detail as you can so the team can triage quickly.
  - type: input
    id: tool_name
    attributes:
      label: Tool Name
      description: The exact name of the tool.
      placeholder: e.g., minimap2
    validations:
      required: true
  - type: input
    id: tool_url
    attributes:
      label: Tool URL
      description: Homepage or canonical source repository.
      placeholder: https://github.com/<org>/<repo>
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domain / Topic
      description: Area the tool serves (e.g., alignment, assembly, QC).
      placeholder: Alignment
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary & purpose
      description: What the tool does and why it is useful in Galaxy.
      placeholder: Short summary
    validations:
      required: true
  - type: textarea
    id: inputs_outputs
    attributes:
      label: Inputs, outputs, and key parameters
      description: Typical inputs/outputs, key options, and expected formats.
      placeholder: Describe I/O and important parameters
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / runtime requirements
      description: System packages, Python/R packages, databases, or containers needed.
      placeholder: List dependencies and versions if known
  - type: textarea
    id: data_sources
    attributes:
      label: Reference data or external resources
      description: Links to required reference data or downloads.
      placeholder: URLs for reference data
  - type: textarea
    id: license
    attributes:
      label: License / terms of use
      description: Include a license name and link if available.
      placeholder: e.g., MIT, GPL-3.0
  - type: textarea
    id: other_notes
    attributes:
      label: Additional notes
      description: Anything else that will help reviewers triage the request.
      placeholder: Optional context
